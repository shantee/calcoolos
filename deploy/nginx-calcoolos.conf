# Site Calcoolos pour Nginx (Ubuntu). MODÈLE : à relire et adapter sur le serveur.
#
# Hypothèses (à confirmer par Philippe avant toute installation) :
# - le site vit dans /srv/calcoolos/current (lien vers la version en service) ;
# - le tunnel Cloudflare existant enverra le futur nom de domaine vers ce bloc,
#   ici à l'écoute en local seulement (aucune modification Cloudflare/DNS sans accord) ;
# - PHP-FPM 8.3 utilise un pool dédié « calcoolos » (deploy/php-fpm-calcoolos.conf).
#
# Copier vers /etc/nginx/sites-available/calcoolos, relier dans sites-enabled,
# puis : sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8088;
    server_name calcoolos.example.invalid;   # À REMPLACER par le vrai nom de domaine

    # Derrière le tunnel Cloudflare, la vraie adresse du visiteur arrive dans cet en-tête.
    # Sans danger ici car Nginx n'écoute qu'en local (seul cloudflared peut lui parler).
    # Indispensable pour que la limite d'essais de mot de passe vise le bon visiteur.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    root /srv/calcoolos/current/dist;
    index index.html;
    charset utf-8;

    # Sécurité : la même liste est vérifiée par scripts/csp-check.mjs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    # Journaux minimaux : pas d'adresse IP complète conservée côté Nginx.
    access_log off;
    error_log /var/log/nginx/calcoolos-error.log warn;

    client_max_body_size 64k;

    # API PHP : toutes les adresses /api/… vont au même point d'entrée.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/calcoolos/current/server/public/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-calcoolos.sock;
        fastcgi_read_timeout 15s;
    }

    # Fichiers construits par Vite : noms avec empreinte, donc cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages HTML : toujours fraîches (elles pointent vers les nouveaux fichiers).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    # Rien d'autre que dist/ n'est servi (le code PHP et la configuration restent hors d'atteinte).
    location ~ /\. {
        deny all;
    }
}
