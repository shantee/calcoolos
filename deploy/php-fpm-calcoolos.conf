; Pool PHP-FPM dédié à Calcoolos. MODÈLE : à copier vers /etc/php/8.3/fpm/pool.d/calcoolos.conf
; puis : sudo systemctl reload php8.3-fpm
;
; Un pool à part : utilisateur système distinct, limites propres, aucun impact sur les
; autres sites PHP du serveur.

[calcoolos]
user = calcoolos
group = calcoolos

listen = /run/php/php8.3-fpm-calcoolos.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Configuration et secrets : un fichier HORS du dépôt, lisible par root et calcoolos seulement.
env[CALCOOLOS_ENV_FILE] = /etc/calcoolos/calcoolos.env

; Le code PHP ne voit que ce dont il a besoin.
php_admin_value[open_basedir] = /srv/calcoolos/:/etc/calcoolos/:/var/lib/calcoolos/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/calcoolos/php-error.log
php_admin_value[memory_limit] = 64M
php_admin_value[post_max_size] = 64K
php_admin_value[upload_max_filesize] = 0
php_admin_flag[expose_php] = off
php_admin_value[session.save_path] = /var/lib/calcoolos/sessions
